<!DOCTYPE html><meta charset="utf-8"><title>Belajar Matematika SD</title>
<!-- Pengacak 3 harga untuk uji harga. Dipakai jika semua trafik masuk lewat satu link (mis. link di bio).
     Pengunjung yang sama selalu mendapat harga yang sama. Untuk iklan berbayar, lebih bersih memakai 3 URL terpisah. -->
<script>let v;try{v=localStorage.getItem('hv')}catch(e){}if(!['49','129','159'].includes(v)){v=['49','129','159'][Math.floor(Math.random()*3)];try{localStorage.setItem('hv',v)}catch(e){}}
location.replace('harga-'+v+'.html'+location.search+location.hash)</script>
